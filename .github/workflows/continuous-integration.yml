name: Continuous Integration

on:
  push:
    branches: ["main"]
    paths-ignore:
      - maintenance/**/*.*
  pull_request:
    paths-ignore:
      - maintenance/**/*.*

jobs:
  unit_test_frontend_redesign:
    name: Unit Tests (Redesign Frontend)
    runs-on: ubuntu-22.04
    env:
      ALLOWED_HOSTS: legacy.localhost,localhost,mozfest.localhost,default-site.com,secondary-site.com
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PULSE_API_DOMAIN: https://network-pulse-api-production.herokuapp.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run redesign unit tests with coverage
        run: yarn workspace redesign test

  preroll:
    name: Preroll (Build Frontend & Collect Static)
    runs-on: ubuntu-22.04
    env:
      ALLOWED_HOSTS: legacy.localhost,localhost,mozfest.localhost,default-site.com,secondary-site.com
      BASKET_URL: https://basket-dev.allizom.org
      CONTENT_TYPE_NO_SNIFF: True
      CORS_ALLOWED_ORIGINS: "*"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/network
      DEBUG: True
      DJANGO_SECRET_KEY: secret
      DOMAIN_REDIRECT_MIDDLEWARE_ENABLED: False
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NEWSLETTER_SIGNUP_METHOD: "BASKET"
      PIPENV_VERBOSITY: -1
      RANDOM_SEED: 530910203
      SET_HSTS: False
      SSL_REDIRECT: False
      TARGET_DOMAINS: localhost
      USE_S3: False
      X_FRAME_OPTIONS: DENY
      XSS_PROTECTION: True
      WAGTAIL_NOTIFICATION_EMAIL: WAGTAIL_NOTIFICATION_EMAIL
      WAGTAIL_NOTIFICATION_EMAIL_PASSWORD: WAGTAIL_NOTIFICATION_EMAIL_PASSWORD
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: 3.11
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Install Python Dependencies
        run: pip install -r requirements.txt -r dev-requirements.txt
      - name: Install Node Dependencies
        run: yarn install --frozen-lockfile
      - name: Build frontend assets
        run: yarn build
      - name: Collect static files
        run: python ./manage.py collectstatic --no-input --verbosity 0
      - name: Upload preroll artifact
        uses: actions/upload-artifact@v4
        with:
          name: preroll-static
          path: |
            foundation_cms/static/compiled
            foundation_cms/legacy_apps/static/compiled
            staticfiles
          retention-days: 1

  test_backend:
    name: "Backend Test Suite (shard ${{ matrix.shard }}/${{ strategy.job-total }})"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: network
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      ALLOWED_HOSTS: legacy.localhost,localhost,mozfest.localhost,default-site.com,secondary-site.com
      BASKET_URL: https://basket-dev.allizom.org
      CONTENT_TYPE_NO_SNIFF: True
      CORS_ALLOWED_ORIGINS: "*"
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/network
      DEBUG: True
      DJANGO_SECRET_KEY: secret
      DOMAIN_REDIRECT_MIDDLEWARE_ENABLED: False
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NEWSLETTER_SIGNUP_METHOD: "BASKET"
      PIPENV_VERBOSITY: -1
      RANDOM_SEED: 530910203
      SET_HSTS: False
      SSL_REDIRECT: False
      TARGET_DOMAINS: localhost
      USE_S3: False
      X_FRAME_OPTIONS: DENY
      XSS_PROTECTION: True
      WAGTAIL_NOTIFICATION_EMAIL: WAGTAIL_NOTIFICATION_EMAIL
      WAGTAIL_NOTIFICATION_EMAIL_PASSWORD: WAGTAIL_NOTIFICATION_EMAIL_PASSWORD
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: 3.11
          cache: "pip"
      - name: Install Python Dependencies
        run: pip install -r requirements.txt -r dev-requirements.txt
      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          # run_id keeps the key always-miss so this re-saves fresh archives
          # every run instead of freezing on whatever was cached first. matrix.shard
          # keeps concurrent shards from racing to save the same cache key.
          key: apt-archives-test_backend-gettext-ffmpeg-${{ runner.os }}-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            apt-archives-test_backend-gettext-ffmpeg-${{ runner.os }}-${{ matrix.shard }}-
      - name: Install additional tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext ffmpeg
      - name: Prepare test environment
        run: |
          python ./manage.py check
          python ./manage.py makemigrations --check --dry-run
          python ./manage.py migrate --no-input
          python ./manage.py block_inventory
          python ./manage.py compilemessages
      - name: Determine pytest worker count
        id: workers
        run: echo "count=$(python -c 'import os; print(os.cpu_count())')" >> "$GITHUB_OUTPUT"
      - name: Pre-create sharded test databases
        # Clones one fully-migrated database per xdist worker from a single migrated
        # template, instead of letting each worker replay the full migration history
        # itself (see prepare_sharded_test_databases for why this matters here).
        run: python ./manage.py prepare_sharded_test_databases ${{ steps.workers.outputs.count }}
      - name: Run Tests
        env:
          COVERAGE_FILE: .coverage.${{ matrix.shard }}
        run: >-
          cd foundation_cms && pytest --reuse-db -n ${{ steps.workers.outputs.count }}
          --splits ${{ strategy.job-total }} --group ${{ matrix.shard }}
          -v --ds=foundation_cms.settings.test --cov=foundation_cms --cov-report=
      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.shard }}
          path: foundation_cms/.coverage.${{ matrix.shard }}
          retention-days: 1
          include-hidden-files: true

  combine_coverage:
    name: Combine Coverage
    runs-on: ubuntu-22.04
    needs: test_backend
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: 3.11
          cache: "pip"
      - name: Install Python Dependencies
        run: pip install -r requirements.txt -r dev-requirements.txt
      - name: Download shard coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          path: foundation_cms
          merge-multiple: true
      - name: Combine and report coverage
        run: cd foundation_cms && coverage combine && coverage report

  backend_test_suite:
    # Required-status-check gate: sharding test_backend into a matrix means it now
    # reports as separate checks per shard ("Backend Test Suite (shard 1/4)", etc.)
    # instead of one "Backend Test Suite" check. This job stands in as that single
    # check for branch protection -- see PR description for the required repo
    # settings change needed alongside this.
    name: Backend Test Suite
    runs-on: ubuntu-22.04
    needs: test_backend
    if: always()
    steps:
      - name: Check shard results
        run: |
          if [ "${{ needs.test_backend.result }}" != "success" ]; then
            echo "One or more Backend Test Suite shards failed: ${{ needs.test_backend.result }}"
            exit 1
          fi

  test_integration:
    name: Integration Tests
    runs-on: ubuntu-22.04
    needs: preroll
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: network
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      ALLOWED_HOSTS: legacy.localhost,127.0.0.1,localhost,mozfest.localhost,default-site.com,secondary-site.com
      BASKET_URL: https://basket-dev.allizom.org
      CONTENT_TYPE_NO_SNIFF: True
      CORS_ALLOWED_ORIGINS: "*"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/network
      DEBUG: True
      DJANGO_SECRET_KEY: secret
      DOMAIN_REDIRECT_MIDDLEWARE_ENABLED: False
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NEWSLETTER_SIGNUP_METHOD: "BASKET"
      PIPENV_VERBOSITY: -1
      RANDOM_SEED: 530910203
      SET_HSTS: False
      SSL_REDIRECT: False
      TARGET_DOMAINS: localhost
      USE_S3: False
      X_FRAME_OPTIONS: DENY
      XSS_PROTECTION: True
      CSP_CONNECT_SRC: "*"
      CSP_FONT_SRC: "'self' https://code.cdn.mozilla.net https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/fonts/ data: https://static.fundraiseup.com/common-fonts/"
      CSP_IMG_SRC: "* data: blob: https://*.fundraiseup.com https://ucarecdn.com https://pay.google.com https://*.paypalobjects.com"
      CSP_FRAME_SRC: "'self' https://www.google.com/recaptcha/ https://*.stripe.com https://pay.google.com https://*.paypal.com https://*.fundraiseup.com https://player.vimeo.com"
      CSP_MEDIA_SRC: "'self' https://s3.amazonaws.com/mofo-assets/foundation/video/ https://player.vimeo.com/ https://download-video-ak.vimeocdn.com "
      CSP_SCRIPT_SRC: "'self' 'unsafe-inline' https://www.google-analytics.com/analytics.js http://*.shpg.org/ https://comments.mozillafoundation.org/ https://airtable.com https://platform.twitter.com https://cdnjs.cloudflare.com/ajax/libs/gsap/3.8.0/gsap.min.js https://cdnjs.cloudflare.com/ajax/libs/gsap/3.8.0/ScrollTrigger.min.js https://*.googletagmanager.com https://*.fundraiseup.com https://mozillafoundation.tfaforms.net https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ 'unsafe-eval' https://*.stripe.com https://m.stripe.network https://*.paypal.com https://*.paypalobjects.com https://pay.google.com https://cc.cdn.civiccomputing.com"
      CSP_STYLE_SRC: "'self' 'unsafe-inline' https://code.cdn.mozilla.net https://platform.twitter.com https://mozillafoundation.tfaforms.net https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css https://cc.cdn.civiccomputing.com"
      SECURE_CROSS_ORIGIN_OPENER_POLICY: "same-origin-allow-popups"
      WAGTAIL_NOTIFICATION_EMAIL: WAGTAIL_NOTIFICATION_EMAIL
      WAGTAIL_NOTIFICATION_EMAIL_PASSWORD: WAGTAIL_NOTIFICATION_EMAIL_PASSWORD
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: 3.11

          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Download preroll artifact
        uses: actions/download-artifact@v4
        with:
          name: preroll-static
      - name: Install Python Dependencies
        run: pip install -r requirements.txt -r dev-requirements.txt
      - name: Install Node Dependencies
        run: yarn install --frozen-lockfile
      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          # run_id keeps the key always-miss so this re-saves fresh archives
          # every run instead of freezing on whatever was cached first.
          key: apt-archives-test_integration-gettext-libgconf-2-4-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            apt-archives-test_integration-gettext-libgconf-2-4-${{ runner.os }}-
      - name: Install additional tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext libgconf-2-4
      - name: Install Playwright
        run: yarn workspace legacy playwright:install
      - name: Prepare test environment
        run: |
          python ./manage.py migrate --no-input
          python ./manage.py block_inventory
          python ./manage.py load_redesign_data
          python ./manage.py legacy_load_fake_data
      - name: Integration Tests
        run: yarn workspace legacy playwright:ci
