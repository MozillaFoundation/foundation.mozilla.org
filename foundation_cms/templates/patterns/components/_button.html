{% if button_style == "btn-primary" or button_style == "btn-secondary" %}
  {% with tag=tag|default:"a" %}
    {% if tag == "button" %}
      <button
        type="{{ button_type|default:'button' }}"
        {% if aria_label %}aria-label="{{ aria_label }}"{% endif %}
        {% if name %}name="{{ name }}"{% endif %}
        {% if button_value %}value="{{ button_value }}"{% endif %}
        {% if disabled %}disabled{% endif %}
        {% if autofocus %}autofocus{% endif %}
        {% if data_attrs %}
          {% for key, value in data_attrs.items %}
            data-{{ key }}="{{ value }}"
          {% endfor %}
        {% endif %}
        class="{% if reskin %}button-reskin button-reskin--{{ button_style }}{% else %}{{ button_style }}{% endif %} {{ button_alignment }} {{ classnames }}">
        {% if reskin %}<span class="button-reskin__label">{{ label }}</span>{% else %}{% include "patterns/components/_button_roller.html" %}{% endif %}
      </button>
    {% else %}
      <a href="{{ url }}"
         {% if value.new_window %}target="_blank"{% endif %}
         {% if autofocus %}autofocus{% endif %}
         {% if data_attrs %}
           {% for key, value in data_attrs.items %}
             data-{{ key }}="{{ value }}"
           {% endfor %}
         {% endif %}
         {% if "hidden" in classnames %}tabindex="-1"{% endif %}
         class="{% if reskin %}button-reskin button-reskin--{{ button_style }}{% else %}{{ button_style }}{% endif %} {{ button_alignment }} {{ classnames }}{% if render_link_type_icon %} link-type-icon{% if link_type == 'external_url' %} external{% elif link_type == 'email' %} email{% else %} link{% endif %}{% endif %}">
        {% if reskin %}<span class="button-reskin__label">{{ label }}</span>{% else %}{% include "patterns/components/_button_roller.html" %}{% endif %}
      </a>
    {% endif %}
  {% endwith %}
{% endif %}
